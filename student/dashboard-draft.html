<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bảng điều khiển Sinh viên (Draft)</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <header class="nav">
    <a href="index.html">Trang chủ</a>
    <a href="#profile">Thông tin cá nhân</a>
    <a href="#facilities">Quản lý CSVC</a>
    <a href="#finance">Tài chính công nợ</a>
    <span style="flex:1"></span>
    <!-- <button id="logoutStudent" class="btn" style="margin-left:auto;">Đăng xuất</button> -->
  </header>

  <main class="container">
    <!-- Hàng 1: Quick Actions & Announcements -->
    <div class="cards">
      <section id="quick-actions" class="card">
        <h1>Quick Actions</h1>
        <div class="actions">
          <button id="logoutStudent" class="btn" style="background: var(--danger); color: #fff;">Đăng xuất</button>
          <button class="btn">Báo hỏng CSVC</button>
          <button class="btn">Thanh toán</button>
        </div>
      </section>

      <section id="announcements" class="card">
        <h1>Thông báo mới nhất</h1>
        <p>Không có thông báo mới</p>
      </section>

      
    </div>

    <!-- Hàng 2: Finance & Profile -->
    <div class="cards" style="margin-top: 20px;">
      <section id="finance" class="card">
        <h1>Trạng thái tài chính</h1>
        <p>Công nợ tháng hiện tại: <strong>0 VND</strong></p>
      </section>

      <section id="profile" class="card">
        <h1>Thông tin sinh viên</h1>
        <div id="info"></div>
      </section>

      
    </div>

    <!-- Placeholder CSVC nếu sau này cần -->
    <section id="facilities" hidden></section>
  </main>

  <script src="../assets/js/main.js"></script>
</body>
</html>
