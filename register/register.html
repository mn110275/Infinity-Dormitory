<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InfiDorm - Đăng ký vào KTX</title>
  <link rel="stylesheet" href="../css/public.css" />
  <link rel="stylesheet" href="../css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="nav">
    <a href="../index.php">Trang chủ</a>
    <a href="register.html" class="active">Đăng ký ở KTX</a>
    <a href="../student/login.php">Đăng nhập Sinh viên</a>
    <a href="../manager/login.php">Đăng nhập Quản lý</a>
  </header>

  <main class="container">
    <h1>Đăng ký ở KTX</h1>

    <form id="registerForm" class="form">
      <label for="name">Họ và tên</label>
      <input type="text" id="name" required />

      <label for="mssv">Mã số sinh viên</label>
      <input type="text" id="mssv" required />

      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="phone">Số điện thoại</label>
      <input type="tel" id="phone" />

      <button type="submit" class="btn btn-pro">Gửi đăng ký</button>
    </form>

    <p id="message" class="message"></p>
  </main>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const mssv = document.getElementById('mssv').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;

      const formData = new FormData();
      formData.append('name', name);
      formData.append('mssv', mssv);
      formData.append('email', email);
      formData.append('phone', phone);

      const res = await fetch('register_process.php', {
        method: 'POST',
        body: formData
      });

      const data = await res.json();
      const messageEl = document.getElementById('message');
      messageEl.textContent = data.message;
      if (data.success) {
        messageEl.style.color = 'green';
        document.getElementById('registerForm').reset();
      } else {
        messageEl.style.color = 'red';
      }
    });

    async function loadStudentList() {
      const res = await fetch('list_register.php');
      const data = await res.json();
      const div = document.getElementById('studentList');
      if (!data.length) {
        div.innerHTML = '<p>Chưa có sinh viên đăng ký nào</p>';
        return;
      }
      let html = '<table><thead><tr><th>Họ và tên</th><th>MSSV</th><th>Email</th><th>SĐT</th><th>Trạng thái</th></tr></thead><tbody>';
      data.forEach(d => {
        html += `<tr>
      <td>${d.REG_NAME}</td>
      <td>${d.REG_STD_ID}</td>
      <td>${d.REG_EMAIL}</td>
      <td>${d.REG_PHONE}</td>
      <td>${d.REG_STATUS}</td>
    </tr>`;
      });
      html += '</tbody></table>';
      div.innerHTML = html;
    }

    loadStudentList();
  </script>
</body>

</html>
